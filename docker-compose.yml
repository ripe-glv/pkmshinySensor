# ─────────────────────────────────────────────────────────────
# ARQUIVO MESTRE - SHINY DETECTOR
# Único arquivo para ambos os PCs. O que define o papel da máquina
# é a flag --profile usada no comando de subida.
# ─────────────────────────────────────────────────────────────

networks:
  shiny_net:
    driver: bridge

services:

  # =========================================================
  # 🖥️ PROFILE: pc_1 (A NAVE-MÃE)
  # Roda o Servidor Central e o Atuador Headless
  # =========================================================

  servidor:
    build:
      context: .
      dockerfile: Dockerfile.servidor
    container_name: shiny_servidor
    profiles: ["pc_1"]
    networks:
      - shiny_net
    ports:
      - "${UDP_PORT:-5000}:${UDP_PORT:-5000}/udp"
      - "${TCP_PORT:-6000}:${TCP_PORT:-6000}/tcp"
    environment:
      BIND_HOST: "0.0.0.0"
      UDP_PORT: "${UDP_PORT:-5000}"
      TCP_PORT: "${TCP_PORT:-6000}"
    restart: unless-stopped

  atuador:
    build:
      context: .
      dockerfile: Dockerfile.atuador
    container_name: shiny_atuador
    profiles: ["pc_1", "pc_2"]  # O atuador pode rodar em ambos os PCs
    networks:
      - shiny_net
    environment:
      # HARDCODED: Protege o container contra o 'localhost' do .env
      SERVER_HOST: "${SERVER_HOST:-servidor}"
      TCP_PORT: "${TCP_PORT:-6000}"
      ARQUIVO: "/data/shinies.json"
    volumes:
      - ./data:/data  # A ponte mágica para a GUI ler os shinies
    depends_on:
      servidor:
        condition: service_started
        required: false
    restart: unless-stopped


  # =========================================================
  # 💻 PROFILE: pc_2 (OS TRABALHADORES)
  # Roda o Gerenciador e os 9 Sensores
  # =========================================================

  gerenciador:
    build:
      context: .
      dockerfile: dockerfile.gerenciador
    container_name: shiny_gerenciador
    profiles: ["pc_2"]
    networks:
      - shiny_net
    ports:
      - "${CTRL_PORT:-7000}:${CTRL_PORT:-7000}/tcp"
    environment:
      # LÊ DO .ENV: Pega o IP do PC 1 (ex: 192.168.1.45)
      SERVER_HOST: "${SERVER_HOST:-servidor}"
      TCP_PORT: "${TCP_PORT:-6000}"
      CTRL_PORT: "${CTRL_PORT:-7000}"
      COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME:-pkmshinysensor}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      servidor:
        condition: service_started
        required: false
    restart: unless-stopped

  # ── SENSORES ─────────────────────────────────────────────
  sensor_gen1:
    build: { context: ., dockerfile: Dockerfile.sensor }
    container_name: shiny_sensor_gen1
    profiles: ["pc_2"]
    networks: [shiny_net]
    environment:
      SERVER_HOST: "${SERVER_HOST:-servidor}"
      UDP_SERVER_PORT: "${UDP_PORT:-5000}"
      GEN: "1"
    depends_on:
      servidor: { condition: service_started, required: false }
    restart: unless-stopped

  sensor_gen2:
    build: { context: ., dockerfile: Dockerfile.sensor }
    container_name: shiny_sensor_gen2
    profiles: ["pc_2"]
    networks: [shiny_net]
    environment:
      SERVER_HOST: "${SERVER_HOST:-servidor}"
      UDP_SERVER_PORT: "${UDP_PORT:-5000}"
      GEN: "2"
    depends_on:
      servidor: { condition: service_started, required: false }
    restart: unless-stopped

  sensor_gen3:
